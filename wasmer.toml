[package]
name = "ups-pms"
version = "1.0.0"
description = "Uganda Prisons Service PMS on Wasmer Edge"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."

[[command]]
name = "serve"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-d", "memory_limit=256M",
    "-d", "display_errors=0",
    "-t", "/app/public",
    "-S", "0.0.0.0:8080",
    "/app/public/index.php"
]
